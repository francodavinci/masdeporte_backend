spring.application.name=AgendaloBackend
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Database Configurationn
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Email Configuration (SENDGRID API)
# Usando SendGrid API HTTPS en lugar de SMTP para Railway
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:no-reply@agendalo.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:Agendalo}

sendgrid.api.timeout=30000
sendgrid.api.retry.attempts=3

# Server Configuration
server.port=${PORT}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}
app.upload.dir=${FILES_UPLOAD_DIR}

# Google OAuth Configuration
google.clientId=${GOOGLE_OAUTH_CLIENT_ID}

# Google Calendar Configuration
google.calendar.client-id=${CALENDAR_CLIENT_ID}
google.calendar.client-secret=${CALENDAR_CLIENT_SECRET}
google.calendar.redirect-uri=${CALENDAR_REDIRECT_URI}
google.calendar.scopes=${CALENDAR_SCOPES}

# Logging Configuration
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.agendalo=INFO

# Date Configuration
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# MercadoPago Configuration
mercadopago.api.base-url=${MP_BASE_URL}
mercadopago.api.oauth-token-path=${MP_TOKEN_PATH}
mercadopago.api.preferences-path=${MP_PREFERENCES_PATH}
mercadopago.back-urls.success=${MP_CALLBACK_URL}
mercadopago.back-urls.failure=${MP_CALLBACK_URL}
mercadopago.back-urls.pending=${MP_CALLBACK_URL}
mercadopago.notification-url=${MP_NOTIFICATION_URL}
mercadopago.client.id=${MP_CLIENT_ID}
mercadopago.client.secret=${MP_CLIENT_SECRET}
mercadopago.redirect.uri=${MP_PAYMENT_CALLBACK_URL}

# Encryption
encryption.key=${ENCRYPTION_KEY}
